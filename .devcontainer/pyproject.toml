[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# This project deliberately omits docstrings unless the WHY is non-obvious (see AGENTS.md) - only
# the module-level summary is required, not one on every small function.
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
]
