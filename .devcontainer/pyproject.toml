[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# This project deliberately omits docstrings unless the WHY is non-obvious (see AGENTS.md) - only
# the module-level summary is required, not one on every small function.
#
# too-many-locals/branches/statements: verify_nlm.py's main() is a deliberately linear,
# numbered-step verification recipe (see its module docstring) - splitting it into smaller
# functions would fragment the one property that makes it trustworthy: a single top-to-bottom
# trace matching those numbered steps, not a complexity problem to refactor away.
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "too-many-locals",
    "too-many-branches",
    "too-many-statements",
]
